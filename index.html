<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Consultation Chatbot - AI Health Assistant</title>
    <meta name="description"
        content="Intelligent health chatbot for medical consultation with structured symptom analysis and emergency detection">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Emergency Banner (hidden by default) -->
    <div id="emergency-banner" class="emergency-banner hidden">
        <div class="emergency-content">
            <div class="emergency-icon">🚨</div>
            <div class="emergency-text">
                <h3>EMERGENCY DETECTED</h3>
                <p>Please seek immediate medical attention or call emergency services</p>
            </div>
            <button id="dismiss-emergency" class="dismiss-btn">×</button>
        </div>
    </div>

    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel" src="react_app.jsx"></script>
</body>

</html>
